# =============================================================================
# NINJATRADER 8 BEST PRACTICES (Observed in codebase)
# =============================================================================
nt8_patterns:

  state_machine:
    description: "Use enums for strategy states - cleaner than boolean flags"
    example: |
      private enum StrategyState {
          Idle, BiasEstablished, C1Touch, C2Confirmed, WaitingForCISD, InTrade
      }
      private StrategyState currentState = StrategyState.Idle;
    files: [TTradesFractalModelV32.cs:42-52, MultiTimeframeC1C2Indicator.cs:47-56]

  multi_timeframe:
    description: "Add data series in Configure, process in OnBarUpdate by BarsInProgress"
    example: |
      // State.Configure
      AddDataSeries(BarsPeriodType.Day, 1);    // BarsInProgress 1 = Daily
      AddDataSeries(BarsPeriodType.Minute, 60); // BarsInProgress 2 = H1

      // OnBarUpdate
      switch (BarsInProgress) {
          case 0: ProcessEntryTimeframe(); break;
          case 1: ProcessBiasTimeframe(); break;
          case 2: ProcessConfirmationTimeframe(); break;
      }
    files: [TTradesFractalModelV32.cs:176-202]

  parameter_attributes:
    description: "Use NinjaScriptProperty, Range, Display for clean UI"
    example: |
      [NinjaScriptProperty]
      [Range(1, int.MaxValue)]
      [Display(Name = "Contracts", Order = 1, GroupName = "Trade Settings")]
      public int Contracts { get; set; }
    files: [TTradesFractalModelV32.cs:76-108]

  debug_logging:
    description: "Conditional debug output with EnableDebug parameter"
    example: |
      [NinjaScriptProperty]
      [Display(Name = "Enable Debug", Order = 7, GroupName = "Debug")]
      public bool EnableDebug { get; set; }

      if (EnableDebug) Print($"[BIAS] {Times[1][0]:d} Bullish");
    files: [TTradesFractalModelV32.cs:107-108, 231]

  entry_exit_management:
    description: "Use SetStopLoss/SetProfitTarget for bracket orders, OnExecutionUpdate for tracking"
    example: |
      SetStopLoss(CalculationMode.Price, stopPrice);
      SetProfitTarget(CalculationMode.Price, targetPrice);
      EnterLong(Contracts, "ReversalLong");
    files: [TTradesFractalModelV32.cs:483-485]

  state_defaults:
    description: "Critical settings in OnStateChange -> State.SetDefaults"
    important_settings:
      - Calculate: OnBarClose (safer) vs OnEachTick (more responsive)
      - IsExitOnSessionCloseStrategy: true (auto-exit EOD)
      - StopTargetHandling: PerEntryExecution (for multi-entry)
      - MaximumBarsLookBack: TwoHundredFiftySix (standard)
      - BarsRequiredToTrade: 20 (minimum history)
    files: [TTradesFractalModelV32.cs:143-173]

  color_serialization:
    description: "Brush properties need XmlIgnore + Serializable pattern for NT8"
    example: |
      [NinjaScriptProperty]
      [XmlIgnore]
      [Display(Name = "Bullish Color", Order = 1, GroupName = "Colors")]
      public Brush BullishColor { get; set; }

      [Browsable(false)]
      public string BullishColorSerializable {
          get { return Serialize.BrushToString(BullishColor); }
          set { BullishColor = Serialize.StringToBrush(value); }
      }
    files: [MultiTimeframeC1C2Indicator.cs:921-943]

