questions:
  - Should video-to-category/tag assignments be shown inline in the video table?
  - Should category/tag filtering actually filter videos (currently shows all videos)?

decisions:
  - client_component_for_filtering: Created LibraryContent client component to handle interactive filtering while keeping auth check server-side
  - native_drag_drop: Used HTML5 native drag events instead of react-beautiful-dnd for simpler implementation
  - slug_based_routing: Used slug-based URLs for public playlist pages for SEO-friendly URLs

findings:
  - next14_async_params: Next.js 14+ requires `await context.params` pattern for dynamic route parameters
  - sqlite_boolean_handling: SQLite uses INTEGER (0/1) for boolean values, not native BOOLEAN
  - playlist_api_flexibility: Added `?all=true` query param to playlists API to get all playlists including unpublished

worked:
  - Modal pattern with backdrop blur and fixed positioning
  - Optimistic UI updates with revert on failure for reordering
  - Color picker with preset colors displayed as circular buttons
  - Promise.all for concurrent data fetching

failed:
  - Playwright MCP browser launch failed due to Chrome session conflicts on Windows

